<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">HERMESS Discord Orchestrator architecture</title>
  <desc id="desc">Owner and Discord send approved work to the HERMESS Runtime, which coordinates Task, Developer, Reviewer, and QA roles before writing to a Git workspace.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1220"/><stop offset="1" stop-color="#172554"/></linearGradient>
    <linearGradient id="runtime" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#2563eb"/><stop offset="1" stop-color="#06b6d4"/></linearGradient>
    <linearGradient id="role" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1e293b"/><stop offset="1" stop-color="#334155"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity=".28"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#67e8f9"/></marker>
  </defs>
  <rect width="1200" height="620" rx="28" fill="url(#bg)"/>
  <text x="70" y="70" fill="#e0f2fe" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="700">HERMESS · Public Preview</text>
  <text x="70" y="105" fill="#94a3b8" font-family="Segoe UI,Arial,sans-serif" font-size="18">A local, evidence-aware engineering workflow through Discord</text>
  <g filter="url(#shadow)">
    <rect x="70" y="230" width="220" height="120" rx="18" fill="#0f766e"/>
    <rect x="350" y="175" width="280" height="230" rx="22" fill="url(#runtime)"/>
    <rect x="700" y="150" width="200" height="90" rx="16" fill="url(#role)"/>
    <rect x="700" y="265" width="200" height="90" rx="16" fill="url(#role)"/>
    <rect x="700" y="380" width="200" height="90" rx="16" fill="url(#role)"/>
    <rect x="970" y="230" width="160" height="120" rx="18" fill="#7c3aed"/>
  </g>
  <g fill="none" stroke="#67e8f9" stroke-width="4" marker-end="url(#arrow)">
    <path d="M290 290h55"/><path d="M630 230h65"/><path d="M630 290h65"/><path d="M630 350h65"/><path d="M900 310h65"/>
  </g>
  <g fill="#f8fafc" font-family="Segoe UI,Arial,sans-serif" text-anchor="middle">
    <text x="180" y="276" font-size="23" font-weight="700">Owner / Discord</text><text x="180" y="310" font-size="15" fill="#ccfbf1">approved request</text>
    <text x="490" y="250" font-size="25" font-weight="700">HERMESS Runtime</text><text x="490" y="285" font-size="15" fill="#cffafe">deterministic state</text><text x="490" y="312" font-size="15" fill="#cffafe">dispatch + evidence</text><text x="490" y="339" font-size="15" fill="#cffafe">explicit gates</text>
    <text x="800" y="190" font-size="22" font-weight="700">Task</text><text x="800" y="218" font-size="14" fill="#cbd5e1">scope + state</text>
    <text x="800" y="305" font-size="22" font-weight="700">Developer</text><text x="800" y="333" font-size="14" fill="#cbd5e1">implementation</text>
    <text x="800" y="420" font-size="22" font-weight="700">Reviewer · QA</text><text x="800" y="448" font-size="14" fill="#cbd5e1">independent gates</text>
    <text x="1050" y="276" font-size="21" font-weight="700">Git Workspace</text><text x="1050" y="308" font-size="14" fill="#ede9fe">auditable change</text>
  </g>
  <text x="600" y="560" fill="#94a3b8" font-family="Segoe UI,Arial,sans-serif" font-size="16" text-anchor="middle">Local automation with visible boundaries: configure, inspect, review, and verify.</text>
</svg>
